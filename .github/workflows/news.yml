name: Update news
concurrency:
  group: pulse-news-update
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"
      - "scripts/fetch-news.mjs"
      - "scripts/summarize-news.mjs"
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Collect fresh RSS news
        run: node scripts/fetch-news.mjs
      - name: Create AI summaries with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: node scripts/summarize-news.mjs
      - name: Commit updated news
        run: |
          git config user.name "pulse-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if [ -f data/ai-cache.json ]; then git add data/ai-cache.json; fi
          git diff --cached --quiet || git commit -m "Update news"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            git fetch origin main
            git rebase origin/main || {
              echo "Resolving generated-data race in favor of this run's generated data."
              git checkout --theirs data/news.json data/ai-cache.json
              git add data/news.json data/ai-cache.json
              GIT_EDITOR=true git rebase --continue
            }
          done

          echo "Could not push generated news after 3 attempts."
          exit 1
