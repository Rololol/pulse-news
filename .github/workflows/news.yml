name: Update news # Germany-first regional pipeline
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"
      - "scripts/fetch-news.mjs"
      - "scripts/summarize-news.mjs"
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: pulse-news-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect fresh RSS news
        run: node scripts/fetch-news.mjs
      - name: Create AI source comparison
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          # Nur ein Gemini-Modell aus dem kostenlosen Free Tier ist zugelassen.
        run: node scripts/summarize-news.mjs
      - name: Scan generated data for exposed secrets
        run: |
          if grep -RIEq 'AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' data.json data/news.json data/ai-cache.json data/archive; then
            echo "Möglicher Geheimschlüssel in generierten Daten gefunden."
            exit 1
          fi
      - name: Validate generated news data
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const data=JSON.parse(await fs.readFile("data.json","utf8"));
          if(!Array.isArray(data)||!data.length||data.length>45)throw new Error("Ungültiger Nachrichtenbestand");
          const ids=new Set();
          for(const x of data){
            for(const key of ["id","t","s","m","c","k","d"])if(!x[key])throw new Error("Pflichtfeld fehlt: "+key);
            if(ids.has(x.id))throw new Error("Doppelte ID: "+x.id);
            ids.add(x.id);
            if(!Array.isArray(x.srcs)||!x.srcs.length)throw new Error("Meldung ohne Quelle: "+x.id);
            if(x.lang!=="de")throw new Error("Meldung nicht als Deutsch markiert: "+x.id);
            if(/\\b(economia|mundial|deve|crescer|recuperacao|gradual)\\b/i.test(x.t))throw new Error("Fremdsprachiger Titel: "+x.t);
          }
          const archive=JSON.parse(await fs.readFile("data/archive/index.json","utf8"));
          if(!Array.isArray(archive))throw new Error("Archivindex ungültig");
          NODE
      - name: Commit generated news data
        run: |
          git config user.name "pulse-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/news.json data/ai-cache.json data/archive/*.json
          git diff --cached --quiet || git commit -m "Update news data"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || {
              git checkout --theirs data.json data/news.json data/ai-cache.json data/archive/
              git add data.json data/news.json data/ai-cache.json data/archive/
              GIT_EDITOR=true git rebase --continue
            }
          done
          exit 1
