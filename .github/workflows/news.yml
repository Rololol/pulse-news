name: Update news
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Build news JSON
        run: node scripts/fetch-news.mjs
      - name: Create free AI summaries with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: node scripts/summarize-news.mjs
      - name: Commit
        run: |
          git config user.name "pulse-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/ai-cache.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
