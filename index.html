<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pulse — World News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">P</div><div><h1>Pulse</h1><small>World News</small></div></div>
  <button class="iconbtn" id="settingsBtn" aria-label="Einstellungen">⚙︎</button>
</header>
<section class="hero">
  <h2>Die Welt. Kurz gefasst.</h2>
  <p>Aktuelle Meldungen, automatisch nach deinen Interessen gefiltert.</p>
</section>
<div class="filters" id="filters"></div>
<p class="status" id="status">News werden geladen …</p>
<main class="grid" id="news"></main>
<div class="footer">RSS-Quellen · letzte 24 Stunden · Quellen sichtbar · keine Volltexte kopiert</div>
</div>

<div class="overlay" id="overlay"></div>

<aside class="sheet" id="articleSheet" aria-label="Meldung">
<button class="iconbtn" id="articleCloseBtn" aria-label="Meldung schließen">✕</button>
<div id="articleDetail"></div>
</aside>

<aside class="sheet" id="sheet">
<button class="iconbtn" id="closeBtn">✕</button>
<h2>Einstellungen</h2>
<div class="section">
<div class="row"><div><label>Sprache</label><small>Nachrichten werden auf Deutsch dargestellt</small></div><span class="setting-value">Deutsch</span></div>
</div>
<h3>Interessen</h3>
<div class="section" id="interestRows"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
