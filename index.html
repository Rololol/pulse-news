<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --nav:44px;
  --bg:#F2F2F7; --card:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2); --fill:rgba(118,118,128,.12);
  --bar:rgba(249,249,249,.82); --segon:#FFFFFF; --tint:#007AFF;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.18);
}
html[data-theme="light"]{color-scheme:light;--bg:#F2F2F7;--card:#FFFFFF;--label:#000000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);--fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.82);--segon:#FFFFFF;--tint:#007AFF;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.18)}
html[data-theme="dark"]{color-scheme:dark;--bg:#000000;--card:#1C1C1E;--label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.82);--segon:#636366;--tint:#0A84FF;--shadow:0 0 0 .5px rgba(255,255,255,.04)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#000000; --card:#1C1C1E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24);
    --bar:rgba(22,22,24,.82); --segon:#636366; --tint:#0A84FF;
    --shadow:0 0 0 .5px rgba(255,255,255,.04);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}
.ic{width:22px;height:22px;display:block}

.statusfill{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:60}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--nav);display:flex;align-items:center;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navtitle{display:flex;align-items:center;height:var(--nav);opacity:0;transition:opacity .2s}.navtitle img{display:block;width:86px;height:auto;max-height:30px;object-fit:contain}.theme-toggle{position:absolute;right:12px;top:6px;width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label2);transition:background .2s,transform .15s}.theme-toggle:hover{background:var(--sep)}.theme-toggle:active{transform:scale(.94)}.theme-toggle .ic{width:17px;height:17px}
.navbar.scrolled .navtitle{opacity:1}
.large{padding:2px 0 12px}
.large h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em}.brand-title{display:flex;align-items:center}.brand-title img{display:block;width:min(220px,62vw);height:auto;max-height:62px;object-fit:contain}
.large .sub{margin:4px 0 0;color:var(--label2);font-size:15px}.freshline{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--label2)}.freshdot{width:7px;height:7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 4px color-mix(in srgb,#34C759 15%,transparent)}

.mq{display:flex;align-items:stretch;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
.mq-label{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);color:#fff;font-weight:700;font-size:13px}
.mq-label svg{width:16px;height:16px}
.mq-view{position:relative;flex:1;overflow:hidden;min-width:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
.mq-track{display:flex;width:max-content;animation:mq var(--dur,60s) linear infinite}
.mq-view:hover .mq-track{animation-play-state:paused}
.mq-list{display:flex;flex:none}
.mq-item{display:flex;align-items:center;gap:8px;border:0;background:none;padding:11px 0 11px 22px;font-size:14px;font-weight:500;white-space:nowrap}
.mq-item i{width:8px;height:8px;border-radius:50%;background:linear-gradient(145deg,var(--c1),var(--c2));flex:none}
@keyframes mq{to{transform:translateX(-50%)}}

.controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav));z-index:15;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin:0 -16px;padding:8px 16px 0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font:600 13px/1 var(--font);padding:8px 2px;border-radius:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04)}.state-picker{position:relative;padding:7px 0 9px}.state-picker select{width:100%;height:36px;appearance:none;-webkit-appearance:none;border:0;border-radius:10px;padding:0 38px 0 12px;background:var(--fill);color:var(--label);font:600 14px/1 var(--font);outline:none}.state-picker::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.8px solid var(--label2);border-bottom:1.8px solid var(--label2);transform:translateY(-65%) rotate(45deg);pointer-events:none}.state-picker select:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 35%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 13px 6px 6px;background:var(--card);box-shadow:var(--shadow);font:600 14px/1 var(--font)}
.chip.all{padding-left:13px}
.chip .ci{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff}
.chip .ci svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff}
.chip[aria-pressed="true"] .ci{background:rgba(255,255,255,.26)}
.chip.all[aria-pressed="true"]{background:var(--label);color:var(--bg)}

.section{margin:18px 4px 8px;color:var(--label2);font-size:13px;font-weight:600}
.hero{display:block;width:100%;text-align:left;border:0;border-radius:24px;padding:20px 20px 18px;margin-top:10px;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));position:relative;overflow:hidden;box-shadow:0 14px 30px -16px var(--c2)}
.hero::before{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::after{content:"";position:absolute;right:40px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:600;line-height:1}
.pill svg{width:14px;height:14px}
.pill.glass{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.htitle{display:block;font-size:26px;line-height:1.14;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.hsum{display:block;margin-top:10px;font-size:16px;line-height:1.4;opacity:.95}
.hfoot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13px;font-weight:500;opacity:.88}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:44px 1fr;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px;background:var(--card);background:color-mix(in srgb,var(--c1) 7%,var(--card));box-shadow:var(--shadow)}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 6px 14px -8px var(--c2)}
.tile .ic{width:23px;height:23px}
.cbody{display:block;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.tag{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;line-height:1.3}
.tag.cat{color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2))}
.tag.reg{background:var(--fill);color:var(--label2)}
.ctitle{display:block;font-size:17px;line-height:1.25;font-weight:700;letter-spacing:-.018em;text-wrap:balance}
.csum{display:block;margin-top:5px;font-size:15px;line-height:1.38;color:var(--label2)}
.cmeta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12.5px;color:var(--label2);font-weight:500}
.cmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:48px 24px;color:var(--label2)}
.empty h3{margin:12px 0 6px;color:var(--label);font-size:20px}
.empty p{margin:0 0 16px;font-size:15px}
.empty .big{width:64px;height:64px;border-radius:20px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(145deg,#8E8E93,#636366);color:#fff}
.empty .big svg{width:32px;height:32px}
.skip-link{position:fixed;left:12px;top:8px;z-index:100;padding:9px 12px;border-radius:10px;background:var(--label);color:var(--bg);transform:translateY(-150%);transition:transform .15s}.skip-link:focus{transform:none}.searchbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:9px 12px;border-radius:12px;background:var(--fill);color:var(--label2)}.searchbar input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--label);font:500 14px var(--font)}.searchbar input::placeholder{color:var(--label2)}.access-tools{display:flex;gap:8px;justify-content:flex-end;margin:5px 0 0}.access-tools button{border:0;border-radius:999px;padding:6px 10px;background:var(--fill);color:var(--label2);font-size:12px;font-weight:600}body.large-text{font-size:19px}body.large-text .ctitle{font-size:19px}body.large-text .csum{font-size:17px}body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.story-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.story-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--fill);color:var(--label2);font-size:11.5px;font-weight:600}.ai-badge{color:var(--tint)}.report-link{display:inline-block;margin-top:12px;color:var(--tint);font-size:13px;text-decoration:none;font-weight:600}.bottom-nav{display:none}@media(max-width:680px){.bottom-nav{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:40;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);justify-content:space-around}.bottom-nav button{flex:1;border:0;background:none;color:var(--label2);font-size:10px;font-weight:600;padding:3px 1px}.bottom-nav button[aria-current="page"]{color:var(--tint)}.bottom-nav .bn-icon{display:block;font-size:17px;line-height:18px;margin-bottom:2px}.wrap{padding-bottom:90px}}.foot{margin:26px 8px 0;text-align:center;color:var(--label2);font-size:12.5px;line-height:1.45}.update-badge{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:5px 9px;border-radius:999px;background:var(--fill);font-size:11.5px}.update-badge i{width:5px;height:5px;border-radius:50%;background:#34C759}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.2,1);z-index:71;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet.open{transform:none}
.grip{display:block;padding:10px 0 8px;touch-action:none}
.grip::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto}
.shead{margin:0 14px;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(150deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.shead::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.shead>*{position:relative}
.shead h2{margin:12px 0 0;font-size:23px;line-height:1.18;font-weight:800;letter-spacing:-.022em;text-wrap:balance}
.sbody{padding:4px 22px 0}
.sbody h4{margin:18px 0 4px;font-size:13px;color:var(--label2);font-weight:600}.relevance{padding:11px 13px;border-radius:13px;background:var(--fill);font-size:15px;line-height:1.42}
.sbody p{margin:0;font-size:17px;line-height:1.45}
.sbody .note{font-size:13px;color:var(--label2);margin-top:14px}.source-links p{margin:0 0 6px;font-size:15px;line-height:1.4}.source-links a{color:var(--tint);text-decoration:none}.source-links a:hover{text-decoration:underline}
.sact{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sact a,.sact button{flex:1 1 auto;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px}
.sact .primary{background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff}
.sact .secondary{background:var(--fill);color:var(--tint)}
.close{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.24);color:#fff;display:grid;place-items:center;z-index:2}
.close svg{width:14px;height:14px}

@media (prefers-reduced-motion:reduce){
  .mq-track{animation:none}
  .mq-view{overflow-x:auto;-webkit-mask-image:none;mask-image:none}
  .mq-list[aria-hidden="true"]{display:none}
  .sheet,.overlay{transition:none}
}
@media (max-width:380px){
  .large h1{font-size:30px}
  .htitle{font-size:23px}
  .seg button{font-size:12px}
}
</style>
</head>

<a class="skip-link" href="#mainContent">Zum Inhalt springen</a><div class="statusfill"></div>
<header class="navbar" id="navbar"><span class="navtitle"><img src="assets/pulse-logo.svg" alt="Pulse"></span><button class="theme-toggle" id="themeToggle" type="button" aria-label="Darstellung wechseln" title="Darstellung wechseln"></button></header>

<main class="wrap" id="mainContent" tabindex="-1">
  <div class="large"><h1 class="brand-title"><img src="assets/pulse-logo.svg" alt="Pulse"></h1><p class="sub" id="dateSub"></p><div class="freshline"><span class="freshdot"></span><span>Aktuelle Nachrichten · KI-zusammengefasst aus mehreren Quellen</span></div></div>
  <div class="mq" id="mq" hidden></div>
  <div class="searchbar" role="search">⌕<input id="searchInput" type="search" placeholder="Nachrichten durchsuchen …" aria-label="Nachrichten durchsuchen"></div>
  <div class="access-tools" aria-label="Barrierefreiheit"><button id="fontToggle" type="button">Größere Schrift</button><button id="motionToggle" type="button">Animationen aus</button></div>
  <div class="controls">
    <div class="seg" id="seg" role="group" aria-label="Reichweite"></div>
    <div class="state-chips" id="states" role="group" aria-label="Bundesländer"></div>
    <div class="chips" id="chips" role="group" aria-label="Themen"></div>
  </div>
  <div id="feed"></div>
  <p class="foot" id="foot"></p><p class="foot"><a href="./impressum.html" style="color:var(--tint);text-decoration:none;font-weight:600">Impressum</a><span style="margin:0 8px;color:var(--label3)">·</span><a href="./quellen.html" style="color:var(--tint);text-decoration:none;font-weight:600">Quellen</a><span style="margin:0 8px;color:var(--label3)">·</span><a href="./arbeitsweise.html" style="color:var(--tint);text-decoration:none;font-weight:600">Arbeitsweise</a><span style="margin:0 8px;color:var(--label3)">·</span><a href="./erklaert.html" style="color:var(--tint);text-decoration:none;font-weight:600">Pulse erklärt</a></p>
</main>

<nav class="bottom-nav" aria-label="Schnellnavigation"><button data-nav="home" aria-current="page"><span class="bn-icon">⌂</span>Start</button><button data-nav="de"><span class="bn-icon">🇩🇪</span>Deutschland</button><button data-nav="local"><span class="bn-icon">📍</span>Bundesland</button><button data-nav="int"><span class="bn-icon">🌍</span>International</button><button data-nav="topics"><span class="bn-icon">☷</span>Themen</button></nav><div id="sheetRoot"></div>
<noscript><p style="padding:24px">Für den Ticker wird JavaScript benötigt.</p></noscript>

<script>
(function(){
'use strict';

const SNAPSHOT='Pulse';
const themeKey='pulse-theme';

const CATS={
  politik:{n:'Politik',c1:'#0A84FF',c2:'#0046D6'},
  wirtschaft:{n:'Wirtschaft',c1:'#FFB800',c2:'#E07B00'},
  sport:{n:'Sport',c1:'#FF6A3D',c2:'#E5251B'},
  wissenschaft:{n:'Wissenschaft',c1:'#B565F0',c2:'#6D3FD8'},
  technik:{n:'Technik',c1:'#20C5E0',c2:'#0A8FB8'},
  panorama:{n:'Panorama',c1:'#FF4F8B',c2:'#D9236D'},
  umwelt:{n:'Umwelt',c1:'#3ED16A',c2:'#178F47'}
};
const COUNTRIES={INT:{n:'Welt',flag:'🌍'},DE:{n:'Deutschland',flag:'🇩🇪'},UK:{n:'England',flag:'🇬🇧'},PT:{n:'Portugal',flag:'🇵🇹'}};
const STATES={BW:'Baden-Württemberg',BY:'Bayern',BE:'Berlin',BB:'Brandenburg',HB:'Bremen',HH:'Hamburg',HE:'Hessen',MV:'Mecklenburg-Vorpommern',NI:'Niedersachsen',NW:'Nordrhein-Westfalen',RP:'Rheinland-Pfalz',SL:'Saarland',SN:'Sachsen',ST:'Sachsen-Anhalt',SH:'Schleswig-Holstein',TH:'Thüringen'};

/* -------- Meldungen: werden automatisch aus data.json geladen -------- */
let ITEMS=[];

/* ------------------------------------------------------------------ *
 *  Zustand (nur im Speicher, keine Einstellungsseite mehr)
 * ------------------------------------------------------------------ */
let S={scope:'state',cat:'all',state:'',search:''};
let currentSheet=null,lastFocus=null;

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(id,cls)=>`<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const cv=cat=>`--c1:${cat.c1};--c2:${cat.c2}`;
function dateOnly(d){const x=new Date(d);return Number.isNaN(x.getTime())?null:new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function diffDays(d){const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());const day=dateOnly(d);return day?Math.round((today-day)/86400000):9999}
function dayLabel(d){const n=diffDays(d);if(n===9999)return '';if(n<=0)return 'Heute';if(n===1)return 'Gestern';if(n<7)return 'Vor '+n+' Tagen';const day=dateOnly(d);return new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short',year:n>300?'numeric':undefined}).format(day)}
function groupOf(d){const n=diffDays(d);return n<=0?'Heute':n===1?'Gestern':n<7?'Diese Woche':'Älter'}
function regionTag(it){const co=COUNTRIES[it.c]||COUNTRIES.INT;const name=it.city||(it.st&&STATES[it.st])||co.n;return co.flag+' '+esc(name)}
function sourceCount(it){return Array.isArray(it.srcs)&&it.srcs.length?it.srcs.length:(it.src?1:0)}

function visible(){
  const list=ITEMS.filter(it=>{
    if(S.cat!=='all'&&it.k!==S.cat)return false;
    if(S.search){const q=S.search.toLowerCase();const hay=[it.t,it.s,it.m,it.r,it.city,it.st,...(Array.isArray(it.srcs)?it.srcs.map(x=>x.name):[])].filter(Boolean).join(' ').toLowerCase();if(!hay.includes(q))return false;}
    if(S.scope==='state')return it.c==='DE';
    if(S.scope==='local')return it.c==='DE'&&(!S.state||it.st===S.state);
    if(S.scope==='all')return it.c!=='DE';
    return true;
  });
  return list.sort((a,b)=>a.d===b.d?b.p-a.p:(a.d<b.d?1:-1));
}

function renderMarquee(){
  const el=$('#mq');
  const pool=ITEMS.slice().sort((a,b)=>a.d===b.d?b.p-a.p:(a.d<b.d?1:-1)).slice(0,12);
  if(!pool.length){el.hidden=true;el.innerHTML='';return}
  const chars=pool.reduce((n,it)=>n+it.t.length,0);
  const list=pool.map(it=>`<button class="mq-item" data-open="${it.id}" style="${cv(CATS[it.k])}"><i></i>${esc(it.t)}</button>`).join('');
  el.hidden=false;
  el.innerHTML=`<div class="mq-label">${ic('wave')}Top</div><div class="mq-view"><div class="mq-track" style="--dur:${Math.max(40,Math.round(chars/7))}s"><div class="mq-list">${list}</div><div class="mq-list" aria-hidden="true">${list.replace(/<button /g,'<button tabindex="-1" ')}</div></div></div>`;
}
function renderControls(){
  const scopes=[['state','Deutschland'],['local','Bundesland'],['all','International']];
  const states=Object.entries(STATES).map(([k,n])=>'<option value="'+k+'" '+(S.state===k?'selected':'')+'>'+n+'</option>').join('');
  $('#states').innerHTML=S.scope==='local'?'<div class="state-picker"><select id="stateSelect" aria-label="Bundesland auswählen"><option value="all" '+(!S.state?'selected':'')+'>Alle Bundesländer</option>'+states+'</select></div>':'';
  $('#seg').innerHTML=scopes.map(s=>`<button data-scope="${s[0]}" aria-pressed="${S.scope===s[0]}">${s[1]}</button>`).join('');
  $('#chips').innerHTML=`<button class="chip all" data-cat="all" aria-pressed="${S.cat==='all'}">Alle Themen</button>`+Object.keys(CATS).map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}" style="${cv(CATS[k])}"><span class="ci">${ic(k)}</span>${CATS[k].n}</button>`).join('');
}
function heroHTML(it){
  const cat=CATS[it.k];
  return `<button class="hero" data-open="${it.id}" style="${cv(cat)}">
    <span class="hero-top"><span class="pill glass">${ic(it.k)}${cat.n}</span><span class="pill glass">${regionTag(it)}</span><span class="pill glass">Aktuell</span></span>
    <span class="htitle">${esc(it.t)}</span>
    <span class="hsum">${esc(it.s)}</span>
    <span class="hfoot"><span>${sourceCount(it)} Quellen · KI-zusammengefasst</span><span>${it.d?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr · '+dayLabel(it.d):dayLabel(it.d)}</span></span>
  </button>`;
}
function cardHTML(it){
  const cat=CATS[it.k];
  return `<button class="card" data-open="${it.id}" style="${cv(cat)}">
    <span class="tile">${ic(it.k)}</span>
    <span class="cbody">
      <span class="tags"><span class="tag cat">${cat.n}</span><span class="tag reg">${regionTag(it)}</span></span>
      <span class="ctitle">${esc(it.t)}</span>
      <span class="csum">${esc(it.s)}</span>
      <span class="cmeta"><span>${sourceCount(it)} Quellen · KI-zusammengefasst</span><span>${it.d?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr · '+dayLabel(it.d):dayLabel(it.d)}</span></span>
    </span>
  </button>`;
}
function emptyHTML(){
  return `<div class="empty"><div class="big">${ic('search')}</div><h3>Nichts gefunden</h3><p>Für diese Auswahl gibt es im Moment keine Meldungen.<br>Wähle eine andere Reichweite oder ein anderes Thema.</p><button class="btn" data-scope="all" data-cat="all">Alles zeigen</button></div>`;
}
function renderFeed(){
  const list=visible(),el=$('#feed');
  if(!list.length){el.innerHTML=emptyHTML();return}
  const [hero,...rest]=list;
  let html=heroHTML(hero),last=null,open=false;
  for(const it of rest){
    const g=groupOf(it.d);
    if(g!==last){if(open)html+='</div>';html+=`<div class="section">${g}</div><div class="list">`;open=true;last=g}
    html+=cardHTML(it);
  }
  if(open)html+='</div>';
  el.innerHTML=html;
}
function renderFoot(){
  const latest=ITEMS.reduce((m,it)=>Math.max(m,Date.parse(it.d)||0),0);
  const when=latest?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(latest)):'–';
  $('#foot').innerHTML=`Mehrere RSS-Quellen · ${ITEMS.length} Meldungen<br><span class="update-badge"><i></i>Letztes Nachrichten-Update ${when} Uhr</span>`;
}
function renderAll(){
  renderMarquee();renderControls();renderFeed();renderFoot();
  if(currentSheet)openSheet(currentSheet,true);
}

function sheetHTML(it,isOpen){
  const cat=CATS[it.k];
  const canShare=typeof navigator!=='undefined'&&!!navigator.share;
  return `<div class="overlay${isOpen?' open':''}" data-close="1"></div>
  <div class="sheet${isOpen?' open':''}" role="dialog" aria-modal="true" aria-label="${esc(it.t)}" style="${cv(cat)}">
    <div class="grip" aria-hidden="true"></div>
    <div class="shead">
      <button class="close" data-close="1" aria-label="Schließen">${ic('x')}</button>
      <span class="hero-top" style="margin:0"><span class="pill glass">${ic(it.k)}${cat.n}</span><span class="pill glass">${regionTag(it)}</span></span>
      <h2>${esc(it.t)}</h2><div class="story-meta"><span class="story-badge ai-badge">KI-zusammengefasst</span><span class="story-badge">${sourceCount(it)} Quellen</span><span class="story-badge">${it.d?'Aktualisiert '+new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr':'Aktuelle Meldung'}</span></div>
    </div>
    <div class="sbody">
      <h4>Kurzfassung</h4><p>${esc(it.s)}</p>
      ${it.m?`<h4>Was bisher bekannt ist</h4><p>${esc(it.m)}</p>`:''}
      ${it.r?`<h4>Warum relevant</h4><p class="relevance">${esc(it.r)}</p>`:''}
      <h4>Quellen</h4>
      <div class="source-links">${(Array.isArray(it.srcs)?it.srcs:[]).map(src=>`<p><a href="${esc(src.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(src.name||'Quelle')}</a></p>`).join('') || '<p>Keine Quellenlinks verfügbar.</p>'}</div>
      ${it.agree?`<h4>Quellenvergleich</h4><p>${esc(it.agree)}</p>`:''}
      ${Array.isArray(it.diff)&&it.diff.length?`<h4>Abweichende Angaben</h4>${it.diff.map(d=>`<p><strong>${esc(d.name)}:</strong> ${esc(d.note)}</p>`).join('')}`:''}
      <p class="note">${sourceCount(it)} Quelle${sourceCount(it)===1?'':'n'} · ${dayLabel(it.d)}</p>
      <a class="report-link" href="mailto:ranking-blot-churn@duck.com?subject=Hinweis%20zu%20einer%20Pulse-Meldung&body=Bitte%20Meldung%20und%20Hinweis%20beschreiben.">Fehler oder fehlende Information melden</a><div class="sact">
        ${it.url?`<a class="primary" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Originalbericht lesen</a>`:''}
        ${canShare?`<button class="secondary" data-share="${it.id}">Teilen</button>`:''}
      </div>
    </div>
  </div>`;
}
function openSheet(id,keep){
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  const wasOpen=!!currentSheet;
  if(!keep&&!wasOpen)lastFocus=document.activeElement;
  currentSheet=id;
  const root=$('#sheetRoot');
  if(keep||wasOpen){root.innerHTML=sheetHTML(it,true)}
  else{
    root.innerHTML=sheetHTML(it,false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{root.querySelectorAll('.overlay,.sheet').forEach(n=>n.classList.add('open'))}));
  }
  document.body.style.overflow='hidden';
  const c=$('.close',root);if(c&&!keep)setTimeout(()=>c.focus({preventScroll:true}),60);
}
function closeSheet(){
  if(!currentSheet)return;
  const root=$('#sheetRoot');
  root.querySelectorAll('.overlay,.sheet').forEach(n=>n.classList.remove('open'));
  currentSheet=null;document.body.style.overflow='';
  setTimeout(()=>{if(!currentSheet)root.innerHTML=''},360);
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-close],[data-scope],[data-state],[data-cat],[data-share]');
  if(!t)return;
  const d=t.dataset;
  if(d.open!==undefined){openSheet(d.open);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.scope!==undefined){S.scope=d.scope;S.state='';renderControls();renderFeed();return}
  if(d.state!==undefined){S.state=d.state==='all'?'':d.state;renderControls();renderFeed();return}
  if(d.cat!==undefined){S.cat=d.cat;renderControls();renderFeed();return}
  if(d.share!==undefined){
    const it=ITEMS.find(i=>i.id===d.share);if(!it)return;
    try{navigator.share({title:it.t,text:it.s,url:it.url||undefined}).catch(()=>{})}catch(err){}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='stateSelect'){
    S.state=e.target.value==='all'?'':e.target.value;
    renderControls();
    renderFeed();
  }
});
$('#searchInput').addEventListener('input',e=>{S.search=e.target.value.trim();renderFeed()});
$('#fontToggle').addEventListener('click',()=>{document.body.classList.toggle('large-text');$('#fontToggle').textContent=document.body.classList.contains('large-text')?'Normale Schrift':'Größere Schrift'});
$('#motionToggle').addEventListener('click',()=>{document.body.classList.toggle('reduce-motion');$('#motionToggle').textContent=document.body.classList.contains('reduce-motion')?'Animationen an':'Animationen aus'});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(!n)return;const v=n.dataset.nav;if(v==='home'||v==='de'){S.scope='state';S.cat='all';S.state=''}if(v==='local'){S.scope='local';S.cat='all';S.state=''}if(v==='int'){S.scope='all';S.cat='all';S.state=''}if(v==='topics'){S.scope='state';S.cat=S.cat==='all'?'politik':'all';S.state=''}renderControls();renderFeed();document.querySelectorAll('[data-nav]').forEach(x=>x.removeAttribute('aria-current'));n.setAttribute('aria-current','page');window.scrollTo({top:0,behavior:document.body.classList.contains('reduce-motion')?'auto':'smooth'})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentSheet)closeSheet()});
let drag=null;
document.addEventListener('touchstart',e=>{if(!e.target.closest('.grip'))return;drag={y:e.touches[0].clientY,dy:0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!drag)return;drag.dy=Math.max(0,e.touches[0].clientY-drag.y);const s=$('.sheet');if(s){s.style.transition='none';s.style.transform='translateY('+drag.dy+'px)'}},{passive:true});
document.addEventListener('touchend',()=>{if(!drag)return;const s=$('.sheet');if(s){s.style.transition='';s.style.transform=''}const far=drag.dy>90;drag=null;if(far)closeSheet()});
window.addEventListener('scroll',()=>{$('#navbar').classList.toggle('scrolled',window.scrollY>44)},{passive:true});

function updateDateTime(){
  const now=new Date();
  const date=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(now);
  const time=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);
  $('#dateSub').textContent=date+' · '+time+' Uhr';
}
updateDateTime();
setInterval(updateDateTime,1000);

function showLoading(){
  $('#feed').innerHTML='<div class="empty"><div class="big">'+ic('wave')+'</div><h3>Nachrichten werden geladen …</h3><p>Pulse gleicht die aktuellen Quellen ab.</p></div>';
  $('#mq').hidden=true;
}
function showError(){
  $('#feed').innerHTML='<div class="empty"><div class="big">'+ic('search')+'</div><h3>Nachrichten konnten nicht geladen werden</h3><p>data.json ist momentan nicht erreichbar. Bitte später erneut versuchen.</p><button class="btn" onclick="location.reload()">Erneut laden</button></div>';
  $('#mq').hidden=true;
}
async function loadData(){
  showLoading();
  const urls=[
    new URL('data.json',document.baseURI).href,
    './data.json?ts='+Date.now(),
    'data/data.json?ts='+Date.now()
  ];
  let lastError=null;
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status+' for '+url);
      const data=await r.json();
      if(!Array.isArray(data)) throw new Error('Invalid data from '+url);
      ITEMS=data;
      renderAll();
      return;
    }catch(e){
      lastError=e;
    }
  }
  console.error('Pulse data load failed:',lastError);
  showError();
}
function setThemeIcon(){const dark=document.documentElement.dataset.theme==='dark';const b=$('#themeToggle');if(!b)return;b.innerHTML=dark?ic('sun'):ic('moon');b.setAttribute('aria-label',dark?'Helles Design':'Dunkles Design')}
function applyTheme(){const saved=localStorage.getItem(themeKey);if(saved)document.documentElement.dataset.theme=saved;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';setThemeIcon()}
$('#themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(themeKey,next);setThemeIcon()});
applyTheme();
setInterval(loadData,300000);
loadData();
})();
</script>
</body>
