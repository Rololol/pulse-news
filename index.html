<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Pulse News</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside>
  <div class="brand"><span class="brand-dot"></span><span>Pulse</span></div>
  <div class="side-label">NEWS</div>
  <nav id="nav"></nav>
  <button class="topics-side" id="openTopics">⌁&nbsp; Alle Themen</button>
  <div class="side-bottom"><button id="theme">◐&nbsp; Erscheinungsbild</button><span>Pulse News · 2026</span></div>

<main>

<section class="home-tabs" id="homeTabs"></section>

</main>
<div class="modal" id="topicModal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">AUSWAHL</span><h2>Alle Themen</h2></div><button class="round" id="closeTopics">×</button></div><div id="allTopics" class="topic-grid"></div></div></div>
<nav class="bottom"><button data-nav="home">⌂<span>Home</span></button><button data-nav="topics">⌁<span>Themen</span></button><button data-nav="search">⌕<span>Suche</span></button></nav>
<script src="app.js"></script></body></html>
