<style>
:root{

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;animation:none!important;transition:none!important;scroll-behavior:auto!important}

.wrap{display:block;width:100%;max-width:560px;margin:0 auto;padding:0 16px 40px}

.navbar.scrolled .navtitle{opacity:1}
.large{padding:2px 0 12px}
.large{padding:18px 0 12px;text-align:center}.large h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.03em}.brand-title{display:flex;align-items:center;justify-content:center}.brand-title img{display:block;width:min(175px,48vw);height:auto;max-height:52px;object-fit:contain}
.large .sub{margin:8px 0 0;color:var(--label2);font-size:14px;font-weight:500}.freshline{display:inline-flex;align-items:center;gap:8px;margin:10px auto 0;padding:7px 12px;border-radius:999px;background:var(--fill);font-size:12px;color:var(--label2)}.freshline{flex-wrap:wrap;justify-content:center}.freshline a{color:var(--tint);font-weight:650;text-decoration:none}.freshline a:hover{text-decoration:underline}.explainer-tools{display:flex;gap:7px;justify-content:center;margin:4px 0 7px}.explainer-tools a{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:6px 10px;background:var(--fill);color:var(--label2);font-size:12px;font-weight:600;text-decoration:none}.freshdot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 4px color-mix(in srgb,#34C759 15%,transparent)}

.mq{display:flex;align-items:stretch;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:6px}
.mq-label{flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:linear-gradient(145deg,#0A84FF,#5E5CE6);color:#fff;font-weight:700;font-size:13px}
.mq-label svg{width:16px;height:16px}

@keyframes mq{to{transform:translateX(-50%)}}

.controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--nav));z-index:15;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin:0 -16px;padding:5px 16px 0;display:flex;flex-direction:column;gap:4px}.search-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:25px;margin:-8px 0 8px;color:var(--label2);font-size:12.5px;font-weight:550}.search-meta:empty,.state-chips:empty,.country-chips:empty{display:none}.search-meta-left{display:flex;align-items:center;gap:7px;min-width:0}.filter-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 8px 5px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filter-chip button{width:18px;height:18px;border:0;border-radius:50%;padding:0;background:var(--fill);display:grid;place-items:center;color:var(--label2);font-size:14px;line-height:1}.filter-clear{border:0;background:none;color:var(--tint);font-size:12.5px;font-weight:650;padding:4px 0}.country-chips,.state-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;margin:0 -16px;scrollbar-width:none}.country-chips::-webkit-scrollbar,.state-chips::-webkit-scrollbar{display:none}.mini-chip{flex:none;border:0;border-radius:999px;padding:7px 11px;background:var(--card);box-shadow:var(--shadow);font:600 13px/1 var(--font);white-space:nowrap}.mini-chip[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.searchbox{position:relative;margin:0}.searchbox .ic{position:absolute;left:11px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--label2);pointer-events:none} .searchbox input{width:100%;height:38px;border:0;border-radius:10px;padding:0 12px 0 36px;background:var(--fill);color:var(--label);font:500 15px/1 var(--font);outline:none}.searchbox input::placeholder{color:var(--label2)}.searchbox input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 35%,transparent)}
/* Mehr anzeigen und Archiv teilen bewusst dieselbe Navigationskomponente. */.large-text .searchbox input{font-size:18px}.large-text .more-button{font-size:19px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin:0}

.hero>*{position:relative;z-index:1}
.hero-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px 5px 8px;font-size:12.5px;font-weight:600;line-height:1}

.pill.glass{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.htitle{display:block;font-size:26px;line-height:1.14;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.hsum{display:block;margin-top:10px;font-size:16px;line-height:1.4;opacity:.95}
.hfoot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13px;font-weight:500;opacity:.88}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:44px 1fr;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px;background:var(--card);background:color-mix(in srgb,var(--c1) 7%,var(--card));box-shadow:var(--shadow)}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 6px 14px -8px var(--c2)}

.cbody{display:block;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.tag{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;line-height:1.3}

.tag.reg{background:var(--fill);color:var(--label2)}
.ctitle{display:block;font-size:17.5px;line-height:1.25;font-weight:750;letter-spacing:-.018em;text-wrap:balance}
.csum{display:block;margin-top:5px;font-size:14.5px;line-height:1.36;color:var(--label2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:12px;color:var(--label3);font-weight:500}.cmeta .sources{color:var(--label2)}.cmeta .ai{color:var(--label3)}
.cmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:48px 24px;color:var(--label2)}.archive-button,.more-button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;margin:18px 0 6px;padding:0 18px;border:0;border-radius:14px;background:var(--card);text-decoration:none;font-size:16px;font-weight:650;box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep);transition:background .15s,transform .15s}.archive-button{color:#000}.more-button{color:var(--tint)}.archive-button:hover,.more-button:hover{background:var(--fill)}.archive-button:active,.more-button:active{transform:scale(.985)}.archive-button svg{width:20px;height:20px;flex:none}.large-text .archive-button,.large-text .more-button{font-size:19px}
.empty h3{margin:12px 0 6px;color:var(--label);font-size:20px}
.empty p{margin:0 0 16px;font-size:15px}
.empty .big{width:64px;height:64px;border-radius:20px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(145deg,#8E8E93,#636366);color:#fff}
.empty .big svg{width:32px;height:32px}

dth:100%;max-width:none;margin:0;padding:0 16px 90px}.bottom-nav{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:40;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);justify-content:space-around}.bottom-nav button{flex:1;border:0;background:none;color:var(--label2);font-size:10px;font-weight:600;padding:3px 1px}.bottom-nav button[aria-current="page"]{color:var(--tint)}.bottom-nav .bn-icon{display:block;font-size:17px;line-height:18px;margin-bottom:2px}.wrap{padding-bottom:90px}}.foot{margin:26px 8px 0;text-align:center;color:var(--label2);font-size:12.5px;line-height:1.45}.info-link{display:flex;align-items:center;justify-content:center;width:max-content;margin:10px auto 0;padding:7px 11px;border-radius:999px;background:var(--fill);color:var(--tint);font-size:12px;font-weight:650;text-decoration:none}.update-badge{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:5px 9px;border-radius:999px;background:var(--fill);font-size:11.5px}.update-badge i{width:5px;height:5px;border-radius:50%;background:#34C759}

    <symbol id="i-wissenschaft" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.2 9.2A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.8L14 9V3M7.5 15h9"/></symbol>
    <symbol id="i-technik" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M9.5 2.5v3M14.5 2.5v3M9.5 18.5v3M14.5 18.5v3M2.5 9.5h3M2.5 14.5h3M18.5 9.5h3M18.5 14.5h3"/></symbol>
    <symbol id="i-panorama" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l2.8 5.9 6.4.9-4.6 4.5 1.1 6.4L12 17.4l-5.7 3.1 1.1-6.4L2.8 9.6l6.4-.9z"/></symbol>
    <symbol id="i-umwelt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-6 5-9 16-9 0 10-3 16-9 16z"/><path d="M4 21c3-6 6-9 11-11"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.3 4.3a11 11 0 0 0 0 15.4M19.7 4.3a11 11 0 0 1 0 15.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
  </defs>
</svg>

<noscript><p style="padding:24px">Für den Ticker wird JavaScript benötigt.</p></noscript>

<script>
(function(){
'use strict';

const SNAPSHOT='Pulse';
const themeKey='pulse-theme';

const CATS={
  politik:{n:'Politik',c1:'#0A84FF',c2:'#0046D6'},
  wirtschaft:{n:'Wirtschaft',c1:'#FFB800',c2:'#E07B00'},
  sport:{n:'Sport',c1:'#FF6A3D',c2:'#E5251B'},
  wissenschaft:{n:'Wissenschaft',c1:'#B565F0',c2:'#6D3FD8'},
  technik:{n:'Technik',c1:'#20C5E0',c2:'#0A8FB8'},
  panorama:{n:'Panorama',c1:'#FF4F8B',c2:'#D9236D'},
  umwelt:{n:'Umwelt',c1:'#3ED16A',c2:'#178F47'}
};
const COUNTRIES={INT:{n:'Welt',flag:'🌍'},DE:{n:'Deutschland',flag:'🇩🇪'},UK:{n:'Vereinigtes Königreich',flag:'🇬🇧'},PT:{n:'Portugal',flag:'🇵🇹'},US:{n:'USA',flag:'🇺🇸'},FR:{n:'Frankreich',flag:'🇫🇷'},ES:{n:'Spanien',flag:'🇪🇸'},IT:{n:'Italien',flag:'🇮🇹'},PL:{n:'Polen',flag:'🇵🇱'},UA:{n:'Ukraine',flag:'🇺🇦'},RU:{n:'Russland',flag:'🇷🇺'},CN:{n:'China',flag:'🇨🇳'},JP:{n:'Japan',flag:'🇯🇵'},IN:{n:'Indien',flag:'🇮🇳'},IR:{n:'Iran',flag:'🇮🇷'}};
const STATES={BW:'Baden-Württemberg',BY:'Bayern',BE:'Berlin',BB:'Brandenburg',HB:'Bremen',HH:'Hamburg',HE:'Hessen',MV:'Mecklenburg-Vorpommern',NI:'Niedersachsen',NW:'Nordrhein-Westfalen',RP:'Rheinland-Pfalz',SL:'Saarland',SN:'Sachsen',ST:'Sachsen-Anhalt',SH:'Schleswig-Holstein',TH:'Thüringen'};

/* -------- Meldungen: werden automatisch aus data.json geladen -------- */
let ITEMS=[],CURRENT_ITEMS=[],ARCHIVE_ITEMS=[];

/* ------------------------------------------------------------------ *
 *  Zustand (nur im Speicher, keine Einstellungsseite mehr)
 * ------------------------------------------------------------------ */
let S={scope:'state',cat:'all',state:'',country:'INT',search:'',shown:6};
let currentSheet=null,lastFocus=null;

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(id,cls)=>`<svg class="ic${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const cv=cat=>`--c1:${cat.c1};--c2:${cat.c2}`;
function dateOnly(d){const x=new Date(d);return Number.isNaN(x.getTime())?null:new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function diffDays(d){const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());const day=dateOnly(d);return day?Math.round((today-day)/86400000):9999}
function dayLabel(d){const n=diffDays(d);if(n===9999)return '';if(n<=0)return 'Heute';if(n===1)return 'Gestern';if(n<7)return 'Vor '+n+' Tagen';const day=dateOnly(d);return new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short',year:n>300?'numeric':undefined}).format(day)}
function groupOf(d){const n=diffDays(d);return n<=0?'Heute':n===1?'Gestern':n<7?'Diese Woche':'Älter'}
function regionTag(it){const co=COUNTRIES[it.c]||COUNTRIES.INT;const name=it.city||(it.st&&STATES[it.st])||co.n;return co.flag+' '+esc(name)}
function sourceCount(it){return Array.isArray(it.srcs)&&it.srcs.length?it.srcs.length:(it.src?1:0)}
function sourceLabel(it){const n=sourceCount(it);return n+' Quelle'+(n===1?'':'n')}
function independentSourceCount(it){return Number.isFinite(Number(it.independent))?Number(it.independent):sourceCount(it)}
function sourceDiversityLabel(it){const n=sourceCount(it),u=independentSourceCount(it);return n>1&&u<n?(n+' Quellen · '+u+' unterschiedliche Domains'):sourceLabel(it)}
function isUpdated(it){
  if(String(it.chg||'').trim())return true;
  const previous=ARCHIVE_ITEMS.find(x=>x&&x.id===it.id);
  if(!previous)return false;
  const curSources=(it.srcs||[]).map(x=>x?.url||'').filter(Boolean).sort().join('|');
  const oldSources=(previous.srcs||[]).map(x=>x?.url||'').filter(Boolean).sort().join('|');
  return (Date.parse(it.d)||0)>(Date.parse(previous.d)||0)
    ||curSources!==oldSources
    ||String(it.t||'')!==String(previous.t||'')
    ||String(it.s||'')!==String(previous.s||'')
    ||String(it.m||'')!==String(previous.m||'')
    ||String(it.r||'')!==String(previous.r||'');
}
function originalUrl(it){return it.url||(Array.isArray(it.srcs)&&it.srcs[0]?.url)||''}
function sourceType(src){try{const h=new URL(src.url||'').hostname.replace(/^www\\./,'').toLowerCase();if(/bundesregierung|bundestag|bundesbank|polizei|justiz|gericht|nasa\\.gov|esa\\.int|noaa\\.gov|who\\.int|europa\\.eu/.test(h))return 'Primärquelle'}catch{}return 'Berichterstattung'}

function normalizeSearch(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function searchableText(it){
  const country=COUNTRIES[it.o]?.n||COUNTRIES[it.c]?.n||'';
  const state=it.st?STATES[it.st]||it.st:'';
  const sources=Array.isArray(it.srcs)?it.srcs.map(x=>x?.name||'').join(' '):'';
  return normalizeSearch([it.t,it.s,it.m,it.r,it.chg,it.agree,it.city,state,country,it.k,sources].join(' '));
}
function visible(){
  const q=normalizeSearch(S.search);
  const list=ITEMS.filter(it=>{
    if(S.cat!=='all'&&it.k!==S.cat)return false;
    if(S.scope==='state'&&it.c!=='DE')return false;
    if(S.scope==='local'&&(it.c!=='DE'||(S.state&&it.st!==S.state)))return false;
    if(S.scope==='all'&&it.c==='DE')return false;
    if(S.scope==='all'&&S.country&&S.country!=='INT'&&it.c!==S.country&&it.o!==S.country)return false;
    if(S.scope==='updated'&&!isUpdated(it))return false;
    if(q&&!searchableText(it).includes(q))return false;
    return true;
  });
  return list.sort((a,b)=>a.d===b.d?b.p-a.p:(a.d<b.d?1:-1));
}

function renderMarquee(){
  const el=$('#mq');
  const pool=CURRENT_ITEMS.slice().sort((a,b)=>a.d===b.d?b.p-a.p:(a.d<b.d?1:-1)).slice(0,12);
  if(!pool.length){el.hidden=true;el.innerHTML='';return}
  const chars=pool.reduce((n,it)=>n+it.t.length,0);
  const list=pool.map(it=>`<button class="mq-item" data-open="${it.id}" style="${cv(CATS[it.k])}"><i></i>${esc(it.t)}</button>`).join('');
  el.hidden=false;
  el.innerHTML=`<div class="mq-label">${ic('wave')}Top</div><div class="mq-view"><div class="mq-track" style="--dur:${Math.max(40,Math.round(chars/7))}s"><div class="mq-list">${list}</div><div class="mq-list" aria-hidden="true">${list.replace(/<button /g,'<button tabindex="-1" ')}</div></div></div>`;
}
function renderControls(){
  const scopes=[['state','Deutschland'],['local','Bundesland'],['all','International'],['updated','Aktualisiert']];
  const availableStates=Object.entries(STATES).filter(([k])=>ITEMS.some(it=>it.c==='DE'&&it.st===k));
  const availableCountries=Object.entries(COUNTRIES).filter(([k])=>k==='INT'||ITEMS.some(it=>it.c===k||it.o===k));
  const q=String(S.search||'').trim();
  const list=visible();
  const shortState=n=>({'Baden-Württemberg':'BW','Mecklenburg-Vorpommern':'MV','Nordrhein-Westfalen':'NRW','Rheinland-Pfalz':'RP','Sachsen-Anhalt':'ST','Schleswig-Holstein':'SH'}[n]||n);
  $('#states').innerHTML=S.scope==='local'?[['','Alle'],...availableStates.map(([k,n])=>[k,shortState(n)])].map(([k,n])=>`<button class="mini-chip" data-state="${k||'all'}" aria-pressed="${S.state===k}">${n}</button>`).join(''):'';
  $('#countryStates').innerHTML=S.scope==='all'?availableCountries.map(([k,v])=>`<button class="mini-chip" data-country="${k}" aria-pressed="${(S.country||'INT')===k}">${v.flag} ${v.n}</button>`).join(''):'';
  $('#seg').innerHTML=scopes.map(s=>`<button data-scope="${s[0]}" aria-pressed="${S.scope===s[0]}">${s[1]}</button>`).join('');
  $('#chips').innerHTML=`<button class="chip all" data-cat="all" aria-pressed="${S.cat==='all'}">Alle Themen</button>`+Object.keys(CATS).map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}" style="${cv(CATS[k])}"><span class="ci">${ic(k)}</span>${CATS[k].n}</button>`).join('');
  $('#searchMeta').innerHTML=q?`<span class="search-meta-left"><span class="filter-chip">Suche: ${esc(q)} <button type="button" data-clear-search aria-label="Suche löschen">×</button></span></span><button class="filter-clear" type="button" data-clear-search>Filter löschen</button>`:``;
}
function heroHTML(it){
  const cat=CATS[it.k];
  return `<button class="hero" data-open="${it.id}" style="${cv(cat)}">
    <span class="hero-top"><span class="pill glass">${ic(it.k)}${cat.n}</span><span class="pill glass">${regionTag(it)}</span><span class="pill glass">Aktuell</span></span>
    <span class="htitle">${esc(it.t)}</span>
    <span class="hsum">${esc(it.s)}</span>
    <span class="hfoot"><span>${sourceLabel(it)} · KI-zusammengefasst</span><span>${it.d?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr · '+dayLabel(it.d):dayLabel(it.d)}</span></span>
  </button>`;
}
function cardHTML(it){
  const cat=CATS[it.k];
  return `<button class="card" data-open="${it.id}" style="${cv(cat)}">
    <span class="tile">${ic(it.k)}</span>
    <span class="cbody">
      <span class="tags"><span class="tag cat">${cat.n}</span><span class="tag reg">${regionTag(it)}</span></span>
      <span class="ctitle">${esc(it.t)}</span>
      <span class="csum">${esc(it.s)}</span>
      <span class="cmeta"><span>${sourceDiversityLabel(it)} · KI-zusammengefasst</span><span>${it.d?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr · '+dayLabel(it.d):dayLabel(it.d)}</span></span>
    </span>
  </button>`;
}
function emptyHTML(){
  if(S.scope==='updated')return `<div class="empty"><div class="big">${ic('clock')}</div><h3>Noch keine Aktualisierungen</h3><p>Aktuell wurde noch keine Meldung nach ihrer Veröffentlichung mit neuen Quellen oder Informationen aktualisiert.</p></div>`;
  return `<div class="empty"><div class="big">${ic('search')}</div><h3>Nichts gefunden</h3><p>Für diese Auswahl gibt es im Moment keine Meldungen.<br>Wähle eine andere Reichweite oder ein anderes Thema.</p><button class="btn" data-scope="all" data-cat="all">Alles zeigen</button></div>`;
}
function renderFeed(){
  const list=visible(),el=$('#feed');
  if(!list.length){el.innerHTML=emptyHTML();return}
  const page=list.slice(0,S.shown);
  const [hero,...rest]=page;
  let html=heroHTML(hero),last=null,open=false;
  for(const it of rest){
    const g=groupOf(it.d);
    if(g!==last){if(open)html+='</div>';html+=`<div class="section">${g}</div><div class="list">`;open=true;last=g}
    html+=cardHTML(it);
  }
  if(open)html+='</div>';
  if(S.shown<list.length){
    const remaining=list.length-S.shown;
    html+=`<button class="more-button" type="button" data-more>Mehr anzeigen</button>`;
  }
  if(list.length>6){
    html+=`<a class="archive-button" href="./archiv.html" aria-label="Archiv öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v13H4z"/><path d="M3 4h18v3H3z"/><path d="M9 11h6"/></svg><span>Archiv</span></a>`;
  }
  el.innerHTML=html;
}

function renderFoot(){
  const latest=ITEMS.reduce((m,it)=>Math.max(m,Date.parse(it.d)||0),0);
  const when=latest?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(latest)):'–';
  $('#foot').innerHTML=`Mehrere RSS-Quellen · ${ITEMS.length} Meldungen<br><span class="update-badge"><i></i>Letztes Nachrichten-Update ${when} Uhr</span>`;
}
function renderAll(){
  renderMarquee();renderControls();renderFeed();renderFoot();
  if(currentSheet)openSheet(currentSheet,true);
}

function sheetHTML(it,isOpen){
  const cat=CATS[it.k];
  const canShare=typeof navigator!=='undefined'&&!!navigator.share;
  return `<div class="overlay${isOpen?' open':''}" data-close="1"></div>
  <div class="sheet${isOpen?' open':''}" role="dialog" aria-modal="true" aria-label="${esc(it.t)}" style="${cv(cat)}">
    <div class="grip" aria-hidden="true"></div>
    <div class="shead">
      <button class="close" data-close="1" aria-label="Schließen">${ic('x')}</button>
      <span class="hero-top" style="margin:0"><span class="pill glass">${ic(it.k)}${cat.n}</span><span class="pill glass">${regionTag(it)}</span></span>
      <h2>${esc(it.t)}</h2><div class="story-meta"><span class="story-badge ai-badge">KI-zusammengefasst</span><span class="story-badge">${sourceDiversityLabel(it)}</span><span class="story-badge">${it.d?'Aktualisiert '+new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(it.d))+' Uhr':'Aktuelle Meldung'}</span></div>
    </div>
    <div class="sbody">
      <h4>Kurzfassung</h4><p>${esc(it.s)}</p>
      ${it.m?`<h4>Was bisher bekannt ist</h4><p>${esc(it.m)}</p>`:''}
      ${it.chg?`<h4>Was hat sich geändert?</h4><p class="relevance">${esc(it.chg)}</p>`:''}
      ${it.r?`<h4>Warum relevant</h4><p class="relevance">${esc(it.r)}</p>`:''}
      <h4>Quellen</h4>
      <div class="source-links">${(Array.isArray(it.srcs)?it.srcs:[]).map(src=>`<p><a href="${esc(src.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(src.name||'Quelle')}</a><small style="display:block;color:var(--label3);margin-top:2px">${sourceType(src)}</small></p>`).join('') || '<p>Keine Quellenlinks verfügbar.</p>'}</div>
      ${it.agree?`<h4>Quellenvergleich</h4><p>${esc(it.agree)}</p>`:''}
      ${Array.isArray(it.diff)&&it.diff.length?`<h4>Abweichende Angaben</h4>${it.diff.map(d=>`<p><strong>${esc(d.name)}:</strong> ${esc(d.note)}</p>`).join('')}`:''}
      <p class="note">${sourceDiversityLabel(it)} · ${dayLabel(it.d)} · Die Meldung kann Fehler oder fehlende Informationen enthalten. Es empfiehlt sich, die Originalquellen zu lesen.</p><div class="sact">
        ${originalUrl(it)?`<a class="primary" href="${esc(originalUrl(it))}" target="_blank" rel="noopener noreferrer">Originalbericht lesen</a>`:''}
        ${canShare?`<button class="secondary" data-share="${it.id}">Teilen</button>`:''}
      </div>
    </div>
  </div>`;
}
function openSheet(id,keep){
  const it=ITEMS.find(i=>i.id===id);if(!it)return;
  const wasOpen=!!currentSheet;
  if(!keep&&!wasOpen)lastFocus=document.activeElement;
  currentSheet=id;
  const root=$('#sheetRoot');
  if(keep||wasOpen){root.innerHTML=sheetHTML(it,true)}
  else{
    root.innerHTML=sheetHTML(it,false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{root.querySelectorAll('.overlay,.sheet').forEach(n=>n.classList.add('open'))}));
  }
  document.body.style.overflow='hidden';
  const c=$('.close',root);if(c&&!keep)setTimeout(()=>c.focus({preventScroll:true}),60);
}
function closeSheet(){
  if(!currentSheet)return;
  const root=$('#sheetRoot');
  root.querySelectorAll('.overlay,.sheet').forEach(n=>n.classList.remove('open'));
  currentSheet=null;document.body.style.overflow='';
  setTimeout(()=>{if(!currentSheet)root.innerHTML=''},360);
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-close],[data-scope],[data-state],[data-country],[data-cat],[data-share],[data-more],[data-clear-search]');
  if(!t)return;
  const d=t.dataset;
  if(d.open!==undefined){openSheet(d.open);return}
  if(d.close!==undefined){closeSheet();return}
  if(d.more!==undefined){S.shown+=15;renderFeed();return}
  if(d.scope!==undefined){S.scope=d.scope;S.state='';S.country='INT';S.cat='all';S.shown=6;renderControls();renderFeed();return}
  if(d.state!==undefined){S.state=d.state==='all'?'':d.state;S.shown=6;renderControls();renderFeed();return}
  if(d.country!==undefined){S.country=d.country||'INT';S.shown=6;renderControls();renderFeed();return}
  if(d.clearSearch!==undefined){S.search='';const input=$('#searchInput');if(input)input.value='';S.shown=6;renderControls();renderFeed();return}
  if(d.cat!==undefined){S.cat=d.cat;S.shown=6;renderControls();renderFeed();return}
  if(d.share!==undefined){
    const it=ITEMS.find(i=>i.id===d.share);if(!it)return;
    try{navigator.share({title:it.t,text:it.s,url:originalUrl(it)||undefined}).catch(()=>{})}catch(err){}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){S.search=e.target.value;S.shown=6;renderControls();renderFeed();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='stateSelect'){
    S.state=e.target.value==='all'?'':e.target.value;
    renderControls();
    renderFeed();
  }
});
const savedLargeText=localStorage.getItem('pulse-large-text')==='1';if(savedLargeText){document.body.classList.add('large-text');$('#fontToggle').textContent='Normale Schrift'}$('#fontToggle').addEventListener('click',()=>{const on=document.body.classList.toggle('large-text');localStorage.setItem('pulse-large-text',on?'1':'0');$('#fontToggle').textContent=on?'Normale Schrift':'Größere Schrift'});
$('#motionToggle').addEventListener('click',()=>{document.body.classList.toggle('reduce-motion');$('#motionToggle').textContent=document.body.classList.contains('reduce-motion')?'Animationen an':'Animationen aus'});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(!n)return;const v=n.dataset.nav;if(v==='home'||v==='de'){S.scope='state';S.cat='all';S.state='';S.country='INT'}if(v==='local'){S.scope='local';S.cat='all';S.state='';S.country='INT'}if(v==='int'){S.scope='all';S.cat='all';S.state='';S.country='INT'}if(v==='topics'){S.scope='state';S.cat=S.cat==='all'?'politik':'all';S.state=''}renderControls();renderFeed();document.querySelectorAll('[data-nav]').forEach(x=>x.removeAttribute('aria-current'));n.setAttribute('aria-current','page');window.scrollTo({top:0,behavior:document.body.classList.contains('reduce-motion')?'auto':'smooth'})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentSheet)closeSheet()});
let drag=null;
document.addEventListener('touchstart',e=>{if(!e.target.closest('.grip'))return;drag={y:e.touches[0].clientY,dy:0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!drag)return;drag.dy=Math.max(0,e.touches[0].clientY-drag.y);const s=$('.sheet');if(s){s.style.transition='none';s.style.transform='translateY('+drag.dy+'px)'}},{passive:true});
document.addEventListener('touchend',()=>{if(!drag)return;const s=$('.sheet');if(s){s.style.transition='';s.style.transform=''}const far=drag.dy>90;drag=null;if(far)closeSheet()});
window.addEventListener('scroll',()=>{$('#navbar').classList.toggle('scrolled',window.scrollY>44)},{passive:true});

function updateDateTime(){
  const now=new Date();
  const date=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'}).format(now);
  const time=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(now);
  $('#dateSub').textContent=date+' · '+time+' Uhr';
}
updateDateTime();
setInterval(updateDateTime,1000);

function showLoading(){
  $('#feed').innerHTML='<div class="empty"><div class="big">'+ic('wave')+'</div><h3>Nachrichten werden geladen …</h3><p>Pulse gleicht die aktuellen Quellen ab.</p></div>';
  $('#mq').hidden=true;
}
function showError(){
  $('#feed').innerHTML='<div class="empty"><div class="big">'+ic('search')+'</div><h3>Nachrichten konnten nicht geladen werden</h3><p>data.json ist momentan nicht erreichbar. Bitte später erneut versuchen.</p><button class="btn" onclick="location.reload()">Erneut laden</button></div>';
  $('#mq').hidden=true;
}
async function loadData(){
  showLoading();
  try{
    const currentRes=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});
    if(!currentRes.ok)throw new Error('HTTP '+currentRes.status);
    const current=await currentRes.json();
    if(!Array.isArray(current))throw new Error('Invalid current data');
    CURRENT_ITEMS=current;
  }catch(e){
    console.error('Pulse current data load failed:',e);
    showError();
    return;
  }
  ARCHIVE_ITEMS=[];
  try{
    const idxRes=await fetch('./data/archive/index.json?ts='+Date.now(),{cache:'no-store'});
    if(idxRes.ok){
      const months=await idxRes.json();
      if(Array.isArray(months)){
        const files=await Promise.all(months.map(entry=>fetch('./data/archive/'+encodeURIComponent(entry.file)+'?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])));
        for(const list of files)if(Array.isArray(list))ARCHIVE_ITEMS.push(...list);
      }
    }
  }catch(e){console.warn('Pulse archive load failed:',e)}
  const byId=new Map();
  for(const item of [...CURRENT_ITEMS,...ARCHIVE_ITEMS])if(item?.id&&!byId.has(item.id))byId.set(item.id,item);
  ITEMS=[...byId.values()];
  renderAll();
}

function setThemeIcon(){const dark=document.documentElement.dataset.theme==='dark';const b=$('#themeToggle');if(!b)return;b.innerHTML=dark?ic('sun'):ic('moon');b.setAttribute('aria-label',dark?'Helles Design':'Dunkles Design')}
function applyTheme(){const saved=localStorage.getItem(themeKey);if(saved)document.documentElement.dataset.theme=saved;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark';setThemeIcon()}
$('#themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(themeKey,next);setThemeIcon()});
applyTheme();
setInterval(()=>{if(!currentSheet)loadData()},300000);
loadData();
})();
</script>
