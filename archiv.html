<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<title>Pulse – Archiv</title>
<style>
:root{--bg:#F2F2F7;--card:#FFF;--label:#000;--muted:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);--fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.82);--tint:#007AFF;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.18);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
html[data-theme=dark]{color-scheme:dark;--bg:#000;--card:#1C1C1E;--label:#FFF;--muted:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.82);--tint:#0A84FF;--shadow:0 0 0 .5px rgba(255,255,255,.04)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#000;--card:#1C1C1E;--label:#FFF;--muted:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.82);--tint:#0A84FF;--shadow:0 0 0 .5px rgba(255,255,255,.04)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased}.wrap{max-width:680px;margin:auto;padding:0 16px 90px}.nav{position:relative;left:auto;width:100vw;margin-left:calc(50% - 50vw);transform:none;height:58px;display:flex;align-items:center;justify-content:space-between;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:5;border-bottom:.5px solid var(--sep)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:88px}.back{color:var(--tint);text-decoration:none;font-weight:650}.theme{border:0;border-radius:50%;background:var(--fill);color:inherit;width:32px;height:32px}.head{padding:28px 4px 18px}.head h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}.head p{color:var(--muted);margin:0;font-size:14px;line-height:1.5}.searchbox{position:sticky;top:58px;z-index:4;padding:6px 0 8px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px)}.searchbox input{width:100%;height:40px;border:0;border-radius:11px;background:var(--fill);color:var(--label);padding:0 12px;outline:none;font:500 15px var(--font)}.searchbox input:focus{box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 35%,transparent)}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px;color:var(--muted);font-size:12.5px}.filters{display:flex;gap:8px;overflow-x:auto;padding:5px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;border:0;border-radius:999px;background:var(--card);color:var(--label);box-shadow:var(--shadow);padding:7px 12px;font:600 13px var(--font)}.filter[aria-pressed=true]{background:var(--label);color:var(--bg)}.month{margin:10px 0 0}.month-head{width:100%;height:48px;border:0;border-radius:14px;background:var(--card);color:var(--label);display:flex;align-items:center;justify-content:space-between;padding:0 15px;font:650 16px var(--font);box-shadow:var(--shadow);cursor:pointer}.month-head small{color:var(--muted);font-size:12px;font-weight:500}.month-list{display:flex;flex-direction:column;gap:9px;padding:9px 0 2px}.story{width:100%;border:0;text-align:left;background:var(--card);color:var(--label);border-radius:17px;padding:15px;box-shadow:var(--shadow);cursor:pointer;display:block}.story:active{transform:scale(.99)}.story h3{font-size:17px;line-height:1.25;margin:0 0 6px;font-weight:750}.story p{color:var(--muted);margin:0;font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.story time{display:block;color:var(--label3);font-size:12px;margin-top:9px}.empty{text-align:center;padding:38px 20px;color:var(--muted)}.clear{border:0;background:none;color:var(--tint);font-weight:650}.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:26px 8px}.foot a{color:var(--tint);text-decoration:none;font-weight:650}.archive-overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.archive-sheet{position:fixed;left:50%;bottom:0;width:min(680px,100%);max-height:88vh;overflow:auto;transform:translate(-50%,105%);background:var(--card);color:var(--label);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.2);z-index:41;transition:transform .25s;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}.archive-overlay.open{opacity:1;pointer-events:auto}.archive-sheet.open{transform:translate(-50%,0)}.archive-grip{width:36px;height:5px;border-radius:999px;background:var(--label3);margin:2px auto 14px}.archive-close{position:absolute;right:14px;top:12px;width:32px;height:32px;border:0;border-radius:50%;background:var(--fill);color:var(--label2);font-size:22px;line-height:1}.archive-sheet h2{font-size:25px;line-height:1.15;letter-spacing:-.025em;margin:8px 42px 12px 0}.archive-meta{color:var(--muted);font-size:12.5px;margin-bottom:18px}.archive-sheet h4{font-size:13px;margin:18px 0 6px;color:var(--label2)}.archive-sheet p{margin:0 0 10px;font-size:15px;line-height:1.5}.archive-sources p{margin-bottom:9px}.archive-sources a{color:var(--tint);font-weight:650;text-decoration:none}.archive-actions{display:flex;gap:8px;margin-top:20px}.archive-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:11px;background:var(--tint);color:#fff;text-decoration:none;font-weight:700;font-size:14px}.archive-actions button{border:0;border-radius:11px;background:var(--fill);color:var(--label);font-weight:650;padding:0 14px}
</style>
<link rel="stylesheet" href="./assets/settings.css">
</head>
<body>
<main class="wrap">
<header class="nav"><a class="back" href="./index.html">← Pulse</a><div class="brand"><img src="assets/pulse-logo.svg" alt="Pulse"></div><button class="theme" id="settingsToggle" type="button" aria-label="Einstellungen"></button></header>
<section class="head"><h1>Archiv</h1><p>Ältere Pulse-Meldungen im selben Designsystem wie die Startseite. Die Meldungen sind KI-zusammengefasst; für wichtige Informationen bitte die Originalquellen prüfen.</p></section>
<label class="searchbox"><input id="search" type="search" placeholder="Archiv durchsuchen …" autocomplete="off" aria-label="Archiv durchsuchen"></label>
<div class="meta"><span id="count">Archiv wird geladen …</span><button class="clear" id="clear" hidden>Suche löschen</button></div>
<div class="filters" id="monthsFilter"></div>
<section id="months"><div class="empty">Archiv wird geladen …</div></section><div id="archiveSheetRoot"></div>
<p class="foot"><a href="./arbeitsweise.html">So arbeitet Pulse</a><span style="margin:0 8px">·</span><a href="./quellen.html">Quellen</a><span style="margin:0 8px">·</span><a href="./impressum.html">Impressum</a></p>
</main>
<script>
(async()=>{
const root=document.querySelector('#months'), sheetRoot=document.querySelector('#archiveSheetRoot'), search=document.querySelector('#search'), count=document.querySelector('#count'), clear=document.querySelector('#clear'), monthsFilter=document.querySelector('#monthsFilter');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>{const x=new Date(d);return Number.isNaN(x.getTime())?'':new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(x)+' Uhr'};
let entries=[],activeMonth='all';
try{
 const base=new URL('./',window.location.href);
 const loadJson=async path=>{
   const res=await fetch(new URL(path,base).href+'?v=archive',{cache:'no-store'});
   if(!res.ok)throw new Error('HTTP '+res.status+' für '+path);
   return res.json();
 };
 const idx=await loadJson('data/archive/index.json');
 const files=Array.isArray(idx)?idx:[];
 const loaded=await Promise.all(files.map(entry=>loadJson('data/archive/'+(entry.file||entry.month+'.json')).catch(()=>[])));
 entries=loaded.flatMap(x=>Array.isArray(x)?x:[]);
 if(!entries.length)throw new Error('Keine Archivmeldungen geladen');
 const groups=new Map();
 for(const it of entries){const m=String(it.d||'').slice(0,7);if(!groups.has(m))groups.set(m,[]);groups.get(m).push(it)}
 const months=[...groups.keys()].sort().reverse();
 monthsFilter.innerHTML='<button class="filter" data-month="all" aria-pressed="true">Alle</button>'+months.map(m=>'<button class="filter" data-month="'+esc(m)+'" aria-pressed="false">'+esc(new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(m+'-01T12:00:00')))+' </button>').join('');
 const render=()=>{
   const q=search.value.trim().toLocaleLowerCase('de-DE');
   const filtered=entries.filter(it=>(activeMonth==='all'||String(it.d||'').slice(0,7)===activeMonth)&&(!q||[it.t,it.s,it.m,it.r,it.chg,it.agree].join(' ').toLocaleLowerCase('de-DE').includes(q))).sort((a,b)=>String(a.d).localeCompare(String(b.d))>0?-1:1);
   count.textContent=filtered.length+' Meldungen'+(q?' gefunden':'');
   clear.hidden=!q;
   if(!filtered.length){root.innerHTML='<div class="empty">Keine Meldungen für diese Auswahl.</div>';return}
   const by=new Map();
   for(const it of filtered){const m=String(it.d||'').slice(0,7);if(!by.has(m))by.set(m,[]);by.get(m).push(it)}
   root.innerHTML=[...by.entries()].map(([m,list])=>{
     const title=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(m+'-01T12:00:00'));
     return '<section class="month"><button class="month-head" data-toggle="'+esc(m)+'"><span>'+esc(title)+'</span><small>'+list.length+' Meldungen</small></button><div class="month-list" id="month-'+esc(m)+'">'+list.map(it=>'<button class="story" type="button" data-open="'+esc(it.id||'')+'"><h3>'+esc(it.t)+'</h3><p>'+esc(it.s)+'</p><time>'+fmt(it.d)+'</time></button>').join('')+'</div></section>';
   }).join('');
 };
 monthsFilter.addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(!b)return;activeMonth=b.dataset.month;monthsFilter.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));render()});
 function openEntry(id){
  const it=entries.find(x=>String(x.id)===String(id));
  if(!it)return;
  const root=document.querySelector('#archiveSheetRoot');
  const sources=Array.isArray(it.srcs)?it.srcs.filter(x=>x&&x.url):[];
  const original=it.url||(sources[0]&&sources[0].url)||'';
  root.innerHTML='<div class="archive-overlay" data-close></div><section class="archive-sheet" role="dialog" aria-modal="true" aria-label="'+esc(it.t)+'"><div class="archive-grip"></div><button class="archive-close" type="button" data-close aria-label="Schließen">×</button><h2>'+esc(it.t)+'</h2><div class="archive-meta">'+fmt(it.d)+'</div><h4>Kurzfassung</h4><p>'+esc(it.s)+'</p>'+(it.m?'<h4>Was bisher bekannt ist</h4><p>'+esc(it.m)+'</p>':'')+(it.r?'<h4>Warum relevant</h4><p>'+esc(it.r)+'</p>':'')+(it.chg?'<h4>Was hat sich geändert?</h4><p>'+esc(it.chg)+'</p>':'')+'<h4>Quellen</h4><div class="archive-sources">'+(sources.length?sources.map(src=>'<p><a href="'+esc(src.url)+'" target="_blank" rel="noopener noreferrer">'+esc(src.name||'Quelle öffnen')+'</a></p>').join(''):'<p>Keine Quellenlinks verfügbar.</p>')+'</div>'+(it.agree?'<h4>Quellenvergleich</h4><p>'+esc(it.agree)+'</p>':'')+(original?'<div class="archive-actions"><a href="'+esc(original)+'" target="_blank" rel="noopener noreferrer">Originalbericht lesen</a></div>':'')+'</section>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('.archive-overlay,.archive-sheet').forEach(x=>x.classList.add('open'))));
  document.body.style.overflow='hidden';
}
function closeEntry(){
  const root=document.querySelector('#archiveSheetRoot');
  root.querySelectorAll('.archive-overlay,.archive-sheet').forEach(x=>x.classList.remove('open'));
  document.body.style.overflow='';
  setTimeout(()=>{if(root)root.innerHTML=''},220);
}
root.addEventListener('click',e=>{
  const open=e.target.closest('[data-open]');
  if(open){openEntry(open.dataset.open);return}
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){const list=document.getElementById('month-'+toggle.dataset.toggle);if(list)list.hidden=!list.hidden;return}
  if(e.target.closest('[data-close]'))closeEntry();
});
 sheetRoot.addEventListener('click',e=>{
  if(e.target.closest('[data-close]'))closeEntry();
 });
 search.addEventListener('input',render); clear.addEventListener('click',()=>{search.value='';render();search.focus()}); render();
}catch(e){console.error('Pulse Archiv:',e);root.innerHTML='<div class="empty"><h3>Archiv konnte nicht geladen werden.</h3><p>'+esc(e&&e.message?e.message:'Unbekannter Fehler')+'</p></div>';count.textContent='Archiv nicht verfügbar'}
})();

</script>
<script src="./assets/settings.js"></script>
</body>
</html>
